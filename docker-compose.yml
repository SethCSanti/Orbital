services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orbital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrbitalDb: Host=postgres;Port=5432;Database=orbital;Username=postgres;Password=postgres
      ConnectionStrings__Redis: redis:6379
      Nasa__ApiKey: ${Nasa__ApiKey:-DEMO_KEY}
      SpaceDevs__ApiKey: ${SpaceDevs__ApiKey:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
