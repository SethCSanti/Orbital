name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

jobs:
  backend:
    name: Build & Test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/Orbital.Tests.csproj

      - name: Build
        run: dotnet build tests/Orbital.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/Orbital.Tests.csproj --no-build --configuration Release

  frontend:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: web
        run: bun install

      - name: Type check
        working-directory: web
        run: bun run tsc --noEmit

      - name: Build
        working-directory: web
        run: bun run build

  deploy:
    name: Deploy (hosting target TODO)
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: TODO - connect selected hosting provider
        run: |
          echo "Deployment placeholder: choose Railway, Render, or Fly.io before adding provider-specific commands."
          echo "No hosting provider or deployment credentials are configured yet."
