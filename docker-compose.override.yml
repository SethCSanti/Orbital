services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    build: !reset null
    working_dir: /src
    volumes:
      - ./api:/src/api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
    command: dotnet watch --project /src/api/Orbital.Api.csproj run --no-launch-profile --urls http://+:8080

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: development
    working_dir: /app
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_SIGNALR_HUB_URL: http://localhost:8080
    ports:
      - "3000:3000"
    command: bun run dev -- --hostname 0.0.0.0
    depends_on:
      - api
